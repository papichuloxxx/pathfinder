<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
{{canonical_tag}}  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pathfinder Driveways &amp; Construction">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site_url}}assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#10152A">
  <link rel="icon" href="{{root}}favicon.ico" sizes="48x48">
  <link rel="icon" href="{{root}}assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="{{root}}assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="{{root}}assets/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
  <link rel="preload" href="{{root}}assets/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <style>{{inline_css}}</style>
{{head_extra}}
  <script src="{{root}}assets/js/site.js?v={{v_js}}" defer></script>
</head>
<body data-wa-topic="{{wa_topic}}">
  <a class="skip-link" href="#main">Skip to content</a>
{{> icons}}
{{> header}}
  <main id="main">
{{content}}
  </main>
{{> footer}}
  <aside class="quick-contact" aria-label="Quick contact">
    <a class="wa-float" href="{{wa_link}}" data-wa target="_blank" rel="noopener">
      <svg class="icon icon--fill" aria-hidden="true"><use href="#i-whatsapp"/></svg>
      <span class="wa-float__label">WhatsApp us<span class="visually-hidden"> (opens WhatsApp)</span></span>
    </a>
  </aside>
</body>
</html>
