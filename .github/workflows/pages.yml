# Publishes the site to GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install pillow

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the site for GitHub Pages
        run: |
          # The github.io copy is a preview, so keep it out of search results.
          # With a custom domain (e.g. www.pathdriveway.co.zw) it is indexed normally.
          noindex=""
          case "${{ steps.pages.outputs.host }}" in *.github.io) noindex="--noindex" ;; esac
          python src/build.py --pages --base "${{ steps.pages.outputs.base_path }}/" --site-url "${{ steps.pages.outputs.base_url }}/" $noindex
          # GitHub Pages can't run PHP or read .htaccess, so leave them out of the published files.
          rm -f site/enquiry.php site/.htaccess

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
